## Change the default Omarchy look'n'feel

# Spawn apps on last workspaces
windowrule = workspace 9, match:class [sS]potify
windowrule = workspace 10, match:class [vV]esktop
windowrule = workspace 11, match:class .*chrome.+messages.*
windowrule = workspace 12, match:class .*chrome.+whatsapp.*
windowrule = workspace 13, match:class .*chrome.+instagram.*
windowrule = workspace 14, match:class .*chrome.+messenger.*

# Browsers
windowrule = fullscreen on, match:class [fF]loorp
windowrule = fullscreen off, float on, size 900 700, center on, border_size 1, match:class [Ff]loorp, match:initial_title Library
windowrule = fullscreen on, match:class [oO]pera

# Scratchpad-specific tiling
windowrule = pseudo on, size 1430 850, border_size 1, match:workspace special:scratchpad
workspace = special:scratchpad, gapsin:5, gapsout:15

# VLC
# Disable "resize interface size" in preferences
windowrule = float on, match:class ^vlc$
windowrule = float on, center on, size 1430 850, match:title .*VLC.media.player$

# Ueberzug
windowrule = float on, match:class .*ueberzug.*
windowrule = no_anim on, match:class .*ueberzug.*
windowrule = no_focus on, match:class .*ueberzug.*
windowrule = no_dim on, match:class .*ueberzug.*
windowrule = no_shadow on, match:class .*ueberzug.*

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    gaps_in = 0
    gaps_out = 0
    border_size = 0

    allow_tearing = false
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
  rounding = 0
         
  active_opacity = 1.1
  inactive_opacity = 1.05
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.7

  blur {
    enabled = 0
    size = 1
    passes = 1
    ignore_opacity = true
    new_optimizations = true
    special = false
    popups = true
    brightness = 0.7
    contrast = 1.0
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default

    animation = windows, 1, 4.79, easeOutQuint
        animation = windowsMove, 1, 1.00, easeOutQuint
        animation = windowsIn, 1, 1.0, easeOutQuint, popin 87%
        animation = windowsOut, 1, 0.90, linear, popin 87%

    animation = layers, 1, 3.81, easeOutQuint
        animation = layersIn, 1, 2, easeOutQuint, fade
        animation = layersOut, 1, 0.75, linear, fade

    animation = fade, 1, 2.00, quick
        animation = fadeIn, 1, 0.85, almostLinear
        animation = fadeOut, 1, 0.75, almostLinear
        animation = fadeLayersIn, 1, 0.90, almostLinear
        animation = fadeLayersOut, 1, 0.70, almostLinear

    animation = border, 1, 5.39, easeOutQuint
    animation = workspaces, 0, 0, ease
}
