//////////////////
//// Settings ////
//////////////////

// Mouse
sensitivity "0.5"

// Crosshair Defaults
cl_crosshair_recoil "0"
cl_crosshair_friendly_warning "0"
cl_crosshair_sniper_width "1"
cl_sniper_show_inaccuracy "0"
cl_ironsight_dot_scale "0.6"
cl_crosshaircolor_a "220"
cl_crosshaircolor_r "0"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "0"
cl_crosshair_t "0"

// Grenade Crosshair
cl_grenadecrosshair_keepusercrosshair "0"
cl_grenadecrosshairdelay_smoke "0.5"

// Viewmodel
viewmodel_presetpos "2"
cl_prefer_lefthanded "0"

// Radar
cl_radar_icon_scale_min "0.6"
cl_radar_scale "0.35"
cl_radar_always_centered "0"
cl_radar_rotate "1"
cl_hud_radar_scale "1.3"

// Net
cl_net_buffer_ticks "0" // Increase to reduce net-related stutters
net_client_steamdatagram_enable_override "1"
cl_predict_kill_ragdolls "0"
cl_predict_head_shot_fx "0"
cl_predict_body_shot_fx "0"

// HUD
cl_hud_color "0"
safezonex "0.92"
safezoney "0.92"
hud_scaling "0"
cl_allow_animated_avatars "0"
cl_teamcounter_playercount_instead_of_avatars "1"
cl_teamid_overhead_colors_show "1"
cl_teamid_overhead_fade_near_crosshair "0.75"
cl_autohelp "0"
r_show_build_info "0"

// Miscellaneous
cl_use_opens_buy_menu "0"
engine_no_focus_sleep "0"
snd_mute_losefocus "0"
// snd_voipvolume "2"
voice_always_sample_mic "1"
snd_toolvolume "0.2"
snd_spatialize_lerp "0.5"
snd_steamaudio_enable_perspective_correction "0"
snd_tensecondwarning_volume "0.063" // Bomb 10s Warning 25%
cl_weapon_stealth_reload_toggle "1"
fps_max "0"

/////////////////
///// Binds /////
/////////////////

// Utils
alias dq "disconnect"

// Open Console
bind "scancode64" "toggleconsole" // F7

// Nades
bind "scancode33" "slot6"		  //slot6=HE // 4
bind "scancode9" "slot7"		  //slot7=Flash // N
bind "scancode6" "slot8"		  //slot8=Smoke // V
bind "scancode25" "slot10"		  //slot10=Molly // B

// Open Mic Toggle
voice_threshold -35
alias "+voxptm" "voice_vox 0"
alias "-voxptm" "voice_vox 1"
alias "voxoffM5" bind "mouse5" "use_skill"
alias "voxonM5" bind "mouse5" "+voxptm"
alias voxon "voice_vox 1; bind mouse4 toggle voice_vox; play buttons\blip2; alias defM5 voxonm5; voxonm5; alias vox voxoff"
alias voxoff "voice_vox 0; bind mouse4 +voicerecord; play buttons\blip1; alias defM5 voxoffm5; voxoffm5; alias vox voxon"
alias vox voxon
bind scancode60 vox

// Clutch key
bind "scancode17" "toggle voice_modenable 0 1; play buttons/blip1" // .

// Drop Bomb
alias "+bombdrop" "slot5"
alias "-bombdrop" "drop"
bind "scancode23" "+bombdrop" // W

// Toggle Team Equipment View
alias "equipmentview" "equipmentview_on"
alias "equipmentview_on" "alias equipmentview equipmentview_off; +cl_show_team_equipment;  cl_teamid_overhead_fade_near_crosshair 0"
alias "equipmentview_off" "alias equipmentview equipmentview_on; -cl_show_team_equipment;  cl_teamid_overhead_fade_near_crosshair 0.5"
bind "scancode53" "equipmentview" // `

// Crosshair Switcher
alias "classic" "cl_crosshairdot 1; cl_crosshair_thickness 1; cl_crosshairstyle 4; cl_crosshair_length 6; cl_crosshair_gap 8; cl_crosshair_drawoutline 1; cl_crosshairoutline_a 200; alias Xhair classic2"
alias "classic2" "cl_crosshairdot 1; cl_crosshair_thickness 1; cl_crosshairstyle 4; cl_crosshair_length 6; cl_crosshair_gap 8; cl_crosshair_drawoutline 2; cl_crosshairoutline_a 255; alias Xhair slanted"
alias "slanted" "cl_crosshairdot 0; cl_crosshair_thickness 7; cl_crosshairstyle 9; cl_crosshair_length 8; cl_crosshair_gap 3; cl_crosshair_drawoutline 1; cl_crosshairoutline_a 235; cl_crosshair_dynamic_maxdist_splitratio 0.1; alias Xhair classic"
alias "Xhair" "classic2"

// Recoil Crosshair Switcher
alias default "cl_hud_color 0"
alias white "cl_hud_color 1"
alias orange "cl_hud_color 7"

alias +shoot "+attack; cl_crosshair_recoil 1; spec_next"
alias -shoot "-attack; cl_crosshair_recoil 0"

alias recoil "recoilon"
alias recoilfast "bind mouse1 +shoot; cl_crosshair_recoil 0; alias recoil recoiloff; orange; play buttons\blip2"
alias recoilon "bind mouse1 +attack; cl_crosshair_recoil 1; alias recoil recoilfast; white; play ui/beepclear"
alias recoiloff "bind mouse1 +attack; cl_crosshair_recoil 0; alias recoil recoilon; default; play buttons\blip1"

// Modifier Binds
bind "scancode5" "buymenu" // Buy Menu // NAVKEY
bind "scancode42" "buymenu" // Backspace

alias "defChat" bind "scancode40" "messagemode" // All-Chat // Enter
alias "keyChat" bind "scancode40" "messagemode2"  // Team-Chat

alias "defTool" bind "scancode53" "equipmentview" // Team Equipment View // `
alias "keyTool" bind "scancode53" "noclip"

alias "def3" bind "scancode32" "slot3" // Knife // 3
alias "key3" bind "scancode32" "slot9"  //slot9=Decoy

alias "def4" bind "scancode33" "slot6" // HE // 4
alias "key4" bind "scancode33" "slot4" // Cycle nades

alias "defM5" bind "mouse5" "use_skill"
alias "keyM5" bind "mouse5" "slot12"  //slot12=Healthshot

alias "defXhair" bind "scancode24" "recoil"
alias "keyXhair" bind "scancode24" "Xhair"

alias "+keybinds" "key3; key4; keyM5; keym4; keyGalil; keyAwp; keyChat; keyTool; keyLeft; keyRight; keyUp; keyDown; keyXhair"
alias "-keybinds" "def3; def4; defM5; defm4; defGalil; defAwp; defChat; defTool; defLeft; defRight; defUp; defDown; defXhair"
bind "scancode226" "+keybinds" // ALT

