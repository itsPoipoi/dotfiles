// Bot Binds
bind o toggle bot_mimic -1 3 0 // -1 to possess, 3 to make them stay, 0 to set them free
bind i toggle bot_crouch 1 0

// Zoom
bind h "toggle fov_cs_debug 40 0"

// Smoke fader
alias +fast "host_timescale 10"
alias -fast "host_timescale 1"
bind l +fast

// Smoke Killer
alias killsmoke "ent_fire smokegrenade_projectile kill;ent_fire molotov_projectile kill;ent_fire flashbang_projectile kill;ent_fire hegrenade_projectile kill;ent_fire decoy_projectile kill;stopsound"
bind j killsmoke

// Nade Rethrow
bind k sv_rethrow_last_grenade

// LET'S GOOO
mp_warmup_end
mp_restartgame 1

